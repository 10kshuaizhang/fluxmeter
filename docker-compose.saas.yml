# SaaS overlay: adds control-plane services without changing ingestion semantics.
services:
  api:
    environment:
      FLUXMETER_AUTH_OPTIONAL: "false"
      FLUXMETER_API_KEY: ${FLUXMETER_API_KEY:-test_api_key}
      FLUXMETER_ADMIN_KEY: ${FLUXMETER_ADMIN_KEY:-test_admin_key}
      BUDGET_FAIL_POLICY: closed
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
  gateway:
    environment:
      FLUXMETER_AUTH_OPTIONAL: "false"
      FLUXMETER_API_KEY: ${FLUXMETER_API_KEY:-test_api_key}
      FLUXMETER_ADMIN_KEY: ${FLUXMETER_ADMIN_KEY:-test_admin_key}
      BUDGET_FAIL_POLICY: closed
  control-plane:
    build:
      context: .
      dockerfile: services/control-plane/Dockerfile
    container_name: fluxmeter-control-plane
    ports: ["8001:8001"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CP_ADMIN_KEY: ${CP_ADMIN_KEY:-cp_admin_test_key}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
    depends_on: [redis]
