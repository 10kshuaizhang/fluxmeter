image:
  api:
    repository: your-registry/fluxmeter-api
    tag: "4.8.4"
  webhookWorker:
    repository: your-registry/fluxmeter-webhook
    tag: "4.8.4"

api:
  replicas: 2
  port: 8000
  env:
    FLUXMETER_AUTH_OPTIONAL: "false"
    BUDGET_FAIL_POLICY: "closed"

redis:
  # Secret must contain redis-password when Redis authentication is enabled.
  existingSecret: ""
  host: redis
  port: 6379

kafka:
  brokers: kafka:9092

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true

alerts:
  consumerLagThreshold: 300000
  windowStallSeconds: 30
